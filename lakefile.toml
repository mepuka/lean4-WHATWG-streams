name = "whatwg"
version = "0.1.0"
description = "WHATWG standards reified in Lean 4, one library per standard; Streams first: spec-authoritative first-order model, relational semantics, EffHOL logic layer, checked TypeScript lowering"
keywords = ["whatwg", "streams", "infra", "verified", "lean4"]
license = "MIT"
readmeFile = "README.md"
defaultTargets = ["Whatwg", "Gates", "WhatwgTest",
                  "vendorseal", "citations", "census", "tyxmlschema"]

# Ruling R-6 (docs/SHA256-DAG.md §9), package-wide: no implicit binder is
# invented from a free variable, and every warning is an error at elaboration
# so that `lake --wfail build` and a plain `lake build` decide the same thing.
leanOptions = { autoImplicit = false, relaxedAutoImplicit = false, warningAsError = true }

# The production library: one root per standard under Whatwg/, all
# reached from Whatwg.lean. Semantic declarations and proofs only.
[[lean_lib]]
name = "Whatwg"
globs = ["Whatwg.*"]

# Repository gates implemented in Lean. Tooling, not semantics; audited for
# totality and forbidden axioms under the implementation ceiling.
[[lean_lib]]
name = "Gates"
globs = ["Gates.*"]

# Contracts, attacks, receipts, and the elaboration-time axiom gate.
[[lean_lib]]
name = "WhatwgTest"
globs = ["WhatwgTest.*"]


# Executable entry points. Each is a one-line wrapper under bin/ that calls
# the audited `cli` of its Gates module; bin/ itself holds no logic.

[[lean_exe]]
name = "vendorseal"
srcDir = "bin"
root = "VendorSeal"

[[lean_exe]]
name = "citations"
srcDir = "bin"
root = "Citations"

[[lean_exe]]
name = "trustselftest"
srcDir = "bin"
root = "TrustSelfTest"

# The TyXML schema projection: `generated/tyxml-html-schema.tsv` regenerated
# from the sealed `vendor/tyxml-d2916535/lib/{html_types.mli,html_sigs.mli,
# html_f.ml}` and checked for byte drift (slice H1 of
# docs/HTML-PACKAGE-PLAN.md). The generated `Whatwg.Html.Schema` modules of
# H2 read this projection and nothing else.
[[lean_exe]]
name = "tyxmlschema"
srcDir = "bin"
root = "TyxmlSchema"

# The P1 specification-algorithm census. `root = "bin.Census"` under the
# default `srcDir` resolves to `bin/Census.lean`, matching the `sha256`
# entry point above; there is no `Census` library root to collide with today,
# and the spelling keeps the two entry-point conventions from diverging.
[[lean_exe]]
name = "census"
root = "bin.Census"

# The proved hash functions the gates compute every digest with. Exact commit
# of mepuka/lean4-hash (step 6 of docs/HASH-PACKAGE-PLAN.md); the vendor
# manifest regenerated byte-identically through `Hash.Sha256.sha256` at the
# swap, which is the cutover proof.
[[require]]
name = "hash"
git = "https://github.com/pure-algebra/lean4-hash"
rev = "2447edd76649f035e989914ac899831d66e7dad2"

# The generic effect algebra every standard here builds against (RS-D1 as
# ruled in lean4-effect4 docs/EFFECTS-SPLIT-PLAN.md, EP-9), now with signature
# morphisms, handler transport, families, and the generic first-order Flow.
# Exact commit of tag v0.6.0 of pure-algebra/lean4-effects. Nothing imports it
# until the first Stratum S packet (P4).
[[require]]
name = "effects"
git = "https://github.com/pure-algebra/lean4-effects"
rev = "c28833b3c14431ba2886a0fb66bcc688c86c2589"

# TypeScript as a target: syntax, renderer, identifier profile, host pins.
# Exact commit of tag v0.2.0 of pure-algebra/lean4-typescript. P11 lowers
# through it instead of declaring a second intermediate representation.
[[require]]
name = "typescript"
git = "https://github.com/pure-algebra/lean4-typescript"
rev = "fcbc05a40e52f9bbe8a8e3ee0f4a746ebd4e9554"
