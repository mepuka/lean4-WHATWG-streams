name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
      # The production libraries and gate executables; the test root with its
      # elaboration-time axiom gate is built by the default targets below.
      - name: Build production libraries and gate executables
        run: lake --wfail build Whatwg Gates vendorseal citations census tyxmlschema
      - name: Vendor seal in both directions
        run: lake exe vendorseal
      - name: Internal-citation gate
        run: lake exe citations
      # The TyXML schema projection (slice H1 of docs/HTML-PACKAGE-PLAN.md):
      # generated/tyxml-html-schema.tsv against a fresh regeneration from the
      # sealed vendor/tyxml-d2916535 sources, whose digests the gate refuses
      # to deviate from.
      - name: TyXML schema projection drift
        run: lake exe tyxmlschema
      # Both census steps link the coverage numerator: since the first P3
      # witnesses landed, bin/Census.lean imports
      # WhatwgTest/Audit/SpecCoverage.lean so that the block below is
      # printed from that module's checked emit instead of from assumed zeros.
      # Building the census executable therefore elaborates the numerator's
      # gate, and a red numerator fails here rather than printing a number.
      - name: Specification-algorithm census, and the coverage emit against it
        run: lake exe census
      - name: Specification coverage block from the Lean emit
        run: lake exe census --report
      - name: Test root and the elaboration-time axiom gate
        run: lake --wfail build WhatwgTest
