name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
      # The test root is deliberately red while a frozen breaker battery
      # waits for its builder (test/fixtures/trust-gate/known-red.txt). The
      # production libraries and gate executables build here; the trust
      # self-test below verifies the declared red set, excises it, and runs
      # the axiom gate on the green remainder, so it is the deciding gate.
      - name: Build production libraries and gate executables
        run: lake --wfail build WhatwgStreams Gates Sha256 sha256 vendorseal citations trustselftest census
      - name: Build the audited SHA-256 root with warnings as errors
        run: lake --wfail build Sha256Verified
      - name: Recheck the SHA-256 audit root with an independent kernel
        run: lake env leanchecker --fresh Sha256.Verified
      - name: SHA-256 self-test against FIPS 180-4 vectors
        run: lake exe sha256 --self-test
      - name: Vendor seal in both directions
        run: lake exe vendorseal
      - name: Internal-citation gate
        run: lake exe citations
      - name: Specification-algorithm census against the pinned index.bs
        run: lake exe census
      - name: Specification coverage block
        run: lake exe census --report
      - name: Trust self-test with planted violations
        run: lake exe trustselftest
